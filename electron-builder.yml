appId: net.getpcconnect
productName: PC Connect
publish:
  provider: github
  owner: MondayV
  repo: screen-share
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{.typesafe-i18n.json,svelte.config.mjs,tsconfig.json,tsconfig.node.json}'
  - '!{.claude,screenshots,.github}'
  - '!dev-app-update.yml'
extraResources:
  - from: "resources/tools"
    to: "tools"
    filter:
      - "*.exe"
      - "*.yml"
  - from: "resources/obs-script"
    to: "obs-script"
    filter:
      - "*.py"
win:
  executableName: PCConnect
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: PC Connect
  uninstallDisplayName: PC Connect
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  target:
    - dmg
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: PC Connect
  category: Utility
