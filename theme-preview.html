<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>PCConnect 皮肤预览调试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg-primary);color:var(--text-primary);display:flex;height:100vh;overflow:hidden}
/* Panel */
#panel{width:340px;background:var(--bg-secondary);border-right:1px solid var(--border-color);overflow-y:auto;padding:16px;flex-shrink:0}
#panel h2{color:var(--accent-primary);margin:12px 0 8px;font-size:14px}
#panel label{display:flex;align-items:center;justify-content:space-between;margin:4px 0;font-size:12px;color:var(--text-secondary)}
#panel input[type=color]{width:32px;height:24px;border:1px solid var(--border-color);border-radius:4px;cursor:pointer}
#panel input[type=text]{width:100px;font-size:11px;padding:2px 4px;background:var(--input-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px}
#panel select{width:100%;padding:4px;background:var(--input-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px;font-size:13px}
/* Preview */
#preview{flex:1;overflow-y:auto;padding:24px}
#preview h3{color:var(--accent-primary);margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.box{border:1px solid var(--border-color);padding:16px;border-radius:var(--button-radius);background:var(--card-bg,var(--bg-secondary));box-shadow:var(--shadow);margin:8px 0}
/* Buttons */
.btn{padding:8px 16px;border-radius:var(--button-radius);border:1px solid var(--border-color);font-family:var(--font-ui);font-size:14px;cursor:pointer;transition:all var(--transition-speed);box-shadow:var(--shadow)}
.btn-link{background:var(--accent-secondary);color:#fff;border-color:var(--accent-secondary)}
.btn-link:hover{background:var(--accent-primary);border-color:var(--accent-primary)}
.btn-info{background:var(--accent-primary);color:var(--bg-primary);border-color:var(--accent-primary)}
.btn-danger{background:var(--accent-secondary);color:#fff}
.btn-light{background:var(--bg-secondary);color:var(--text-primary)}
/* Input */
.inp{padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--button-radius);background:var(--input-bg);color:var(--text-primary);font-family:var(--font-ui);font-size:14px;width:200px}
.inp:focus{outline:none;box-shadow:var(--input-focus-shadow)}
/* Card */
.card{border:1px solid var(--border-color);border-radius:var(--button-radius);padding:16px;background:var(--card-bg,var(--bg-secondary));box-shadow:var(--shadow)}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card-bg,var(--bg-secondary));border:1px solid var(--border-color);border-radius:var(--button-radius);padding:24px;min-width:320px;box-shadow:var(--shadow);font-family:var(--font-ui)}
.modal-box h2{color:var(--text-primary);margin-bottom:8px}
.modal-box p{color:var(--text-secondary);margin-bottom:16px}
/* Status */
.status{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-success{background:var(--accent-primary)}
/* Code */
#code{background:var(--bg-secondary);color:var(--accent-primary);padding:16px;font-family:var(--font-mono);font-size:12px;border-radius:var(--button-radius);border:1px solid var(--border-color);white-space:pre;max-height:300px;overflow:auto;margin-top:8px}
.code-label{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px}
::-webkit-scrollbar-track{background:var(--scrollbar-track)}
</style>
</head>
<body>

<div id="panel">
  <div style="margin-bottom:12px">
    <select id="preset" onchange="loadPreset(this.value)">
      <option value="dark">深色 (Dark)</option>
      <option value="cyberpunk">赛博朋克 (Cyberpunk)</option>
    </select>
  </div>
  <h2>🎨 颜色</h2>
  <label>背景 <input type="color" data-var="--bg-primary" onchange="updateVar(this)"></label>
  <label>次背景 <input type="color" data-var="--bg-secondary" onchange="updateVar(this)"></label>
  <label>主文字 <input type="color" data-var="--text-primary" onchange="updateVar(this)"></label>
  <label>次文字 <input type="color" data-var="--text-secondary" onchange="updateVar(this)"></label>
  <label>强调色1 <input type="color" data-var="--accent-primary" onchange="updateVar(this)"></label>
  <label>强调色2 <input type="color" data-var="--accent-secondary" onchange="updateVar(this)"></label>
  <label>边框色 <input type="color" data-var="--border-color" onchange="updateVar(this)"></label>
  <h2>📐 数值</h2>
  <label>按钮圆角(px) <input type="text" data-var="--button-radius" onchange="updateVar(this)"></label>
  <label>过渡速度(s) <input type="text" data-var="--transition-speed" onchange="updateVar(this)"></label>
  <label>字体UI <input type="text" data-var="--font-ui" onchange="updateVar(this)"></label>
  <label>字体等宽 <input type="text" data-var="--font-mono" onchange="updateVar(this)"></label>
  <h2>🎯 滚动条</h2>
  <label>滑块 <input type="color" data-var="--scrollbar-thumb" onchange="updateVar(this)"></label>
  <label>轨道 <input type="color" data-var="--scrollbar-track" onchange="updateVar(this)"></label>
</div>

<div id="preview">
  <h3>按钮</h3>
  <div class="row">
    <button class="btn btn-link">主要操作</button>
    <button class="btn btn-info">信息按钮</button>
    <button class="btn btn-danger">危险操作</button>
    <button class="btn btn-light">次要按钮</button>
  </div>

  <h3>输入框</h3>
  <div class="row">
    <input class="inp" placeholder="输入示例...">
    <input class="inp" placeholder="聚焦测试" autofocus>
  </div>

  <h3>卡片</h3>
  <div class="card" style="max-width:400px">
    <h4 style="color:var(--text-primary);margin-bottom:4px">卡片标题</h4>
    <p style="color:var(--text-secondary);font-size:13px">这是一张使用当前皮肤样式的卡片组件，背景、边框、阴影均跟随皮肤。</p>
  </div>

  <h3>状态指示器</h3>
  <div class="status"><span class="dot dot-success"></span> 连接正常</div>

  <h3>弹窗</h3>
  <button class="btn btn-info" onclick="document.getElementById('modal').classList.add('active')">打开弹窗</button>

  <h3>字体示例</h3>
  <p style="font-family:var(--font-ui)">UI 字体: The quick brown fox jumps over the lazy dog.</p>
  <p style="font-family:var(--font-mono)">Monospace: abcdefghijklmnopqrstuvwxyz 0123456789</p>

  <div class="code-label">
    <h3>CSS 导出</h3>
    <button class="btn btn-light" onclick="copyCode()">复制 CSS</button>
  </div>
  <div id="code"></div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal-box">
    <h2>皮肤预览弹窗</h2>
    <p>此弹窗的背景、边框、文字、按钮完全使用当前皮肤的 CSS 变量。切换皮肤后重新打开即可看到变化。</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-light" onclick="document.getElementById('modal').classList.remove('active')">取消</button>
      <button class="btn btn-link" onclick="document.getElementById('modal').classList.remove('active')">确认</button>
    </div>
  </div>
</div>

<script>
const presets={
dark:{
'--bg-primary':'#1e1e2e','--bg-secondary':'#2a2a3a','--text-primary':'#e0e0ff','--text-secondary':'#a0a0cc',
'--accent-primary':'#7b68ee','--accent-secondary':'#ff6b9d','--border-color':'#3e3e5e',
'--shadow':'0 2px 8px rgba(0,0,0,0.5)','--font-ui':"'Inter',sans-serif","--font-mono":"'Fira Code',monospace",
'--transition-speed':'0.2s','--button-radius':'6px','--card-bg':'#2a2a3a','--input-bg':'#1e1e2e',
'--input-focus-shadow':'0 0 0 2px rgba(123,104,238,0.4)','--scrollbar-thumb':'#5a5a8a','--scrollbar-track':'#2a2a3a'
},
cyberpunk:{
'--bg-primary':'#0a0a1a','--bg-secondary':'#141428','--text-primary':'#e0e0ff','--text-secondary':'#b0b0dd',
'--accent-primary':'#00f0ff','--accent-secondary':'#ff007f','--border-color':'rgba(0,240,255,0.3)',
'--shadow':'0 0 12px rgba(0,240,255,0.3)','--font-ui':"'Orbitron',sans-serif","--font-mono":"'Share Tech Mono',monospace",
'--transition-speed':'0.15s','--button-radius':'2px','--card-bg':'rgba(10,10,26,0.9)','--input-bg':'#0a0a1a',
'--input-focus-shadow':'0 0 10px rgba(0,240,255,0.6)','--scrollbar-thumb':'#00f0ff','--scrollbar-track':'#1a1a2e'
}}

function apply(vars){ Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v)); renderCode() }

function loadPreset(name){
  document.documentElement.setAttribute('data-theme',name);
  const vars=presets[name];
  apply(vars);
  document.querySelectorAll('#panel input[type=color],#panel input[type=text]').forEach(inp=>{
    const k=inp.dataset.var;
    if(k&&vars[k]){ if(inp.type==='color')inp.value=vars[k];else inp.value=String(vars[k]) }
  });
}

function updateVar(inp){ const k=inp.dataset.var; if(k)document.documentElement.style.setProperty(k,inp.value); renderCode() }

function renderCode(){
  const el=document.documentElement;const t=el.getAttribute('data-theme');
  const vars={};for(const s of el.style){if(s.startsWith('--'))vars[s]=el.style.getPropertyValue(s).trim()}
  let css=`[data-theme="${t}"] {\n`;
  Object.entries(vars).forEach(([k,v])=>{ css+=`  ${k}: ${v};\n` });
  css+='}';
  document.getElementById('code').textContent=css;
}

function copyCode(){ navigator.clipboard.writeText(document.getElementById('code').textContent); alert('已复制!') }

loadPreset('dark');
</script>
</body>
</html>
